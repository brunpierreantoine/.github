name: Reusable Bun CI

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version or release channel
        required: false
        default: "1.3.14"
        type: string
      working-directory:
        description: Directory containing package.json
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Cloudflare types
        run: bun run --if-present cf-typecheck

      - name: Type check
        run: bun run --if-present typecheck

      - name: Lint
        run: bun run --if-present lint

      - name: Test
        run: bun run --if-present test:ci

      - name: Test local migrations
        run: bun run --if-present db:test

      - name: Build
        run: bun run build
